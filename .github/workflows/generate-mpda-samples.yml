name: Generate MPDA Sample Files

on:
  workflow_dispatch:

jobs:
  generate-samples:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install Python dependencies
        run: |
          pip install numpy scipy pydub
      
      - name: Generate MPDA sample files
        run: |
          python scripts/generate_all_mpda_signals.py
      
      - name: Commit and push generated samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add samples/
          git diff --staged --quiet || git commit -m "Generate MPDA sample MP3 files"
          git push
